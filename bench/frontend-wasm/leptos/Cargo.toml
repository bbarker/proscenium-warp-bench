# A standalone workspace for the frontend benchmark (docs/REPORT.md): Leptos 0.8,
# patched to the public AlygnHealth/leptos fork pinned below, with fat LTO and one
# codegen unit.
[workspace]
resolver = "2"
members = ["counter", "rows", "cards"]

[workspace.dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2.129"
console_error_panic_hook = "0.1.7"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
leptos = { git = "https://github.com/AlygnHealth/leptos", rev = "f8170f31e7ff1dfc07bcaf24bd72173325ec1226" }
